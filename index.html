<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Geovisor Ecopedagógico de Sevilla, Valle del Cauca: cartografía oficial, fichas pedagógicas y recorridos guiados para estudiantes de grados 6.º a 9.º y sus docentes."
    />
    <meta name="theme-color" content="#F2EEE1" />
    <!-- Aplica el tema guardado antes de pintar, para evitar el destello del tema claro -->
    <script>
      try {
        var t = localStorage.getItem('ecodex-tema')
        if (t === 'oscuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#050906')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@400;600;700&family=Pixelify+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Geovisor Ecopedagógico · Sevilla, Valle del Cauca</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
